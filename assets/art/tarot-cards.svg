<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tc-t tc-d">
<title id="tc-t">Salem Tarot — a three-card spread, face down</title>
<desc id="tc-d">Diagram: three card backs dealt in a spread, each carrying the Magus Axis mark. Hand-authored illustration of the card backs — not the deck artwork, and not a screen capture.</desc>
<defs>
  <radialGradient id="tcglow" cx="50%" cy="36%" r="62%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity=".22"/>
    <stop offset="50%" stop-color="#3b82f6" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#07070d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tcface" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#14141f"/>
    <stop offset="100%" stop-color="#08080f"/>
  </linearGradient>

  <!-- the Magus Axis, canonical geometry lifted verbatim from assets/brand/magus-axis.svg -->
  <g id="magus">
    <g transform="translate(4,1.2) scale(0.28)" fill="none" stroke="#3b82f6"
       stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="m100,10l86.602539,150l-86.602539,-50l62.460411,25.85787l-62.460411,-105.85787l-62.460411,105.85787l62.460411,-25.85787l-86.602539,50l86.602539,-150z"/>
      <path transform="rotate(180,100,110)" d="m100,10l86.602539,150l-86.602539,-50l62.460411,25.85787l-62.460411,-105.85787l-62.460411,105.85787l62.460411,-25.85787l-86.602539,50l86.602539,-150z"/>
    </g>
    <line x1="32" y1="6.5" x2="32" y2="57.5" stroke="#93c5fd" stroke-width="1" opacity=".8"/>
    <g fill="#3b82f6">
      <circle cx="56.25" cy="18" r="2"/><circle cx="56.25" cy="46" r="2"/>
      <circle cx="7.75" cy="46" r="2"/><circle cx="7.75" cy="18" r="2"/>
    </g>
    <circle cx="32" cy="4" r="2.7" fill="#bfdbfe"/>
    <circle cx="32" cy="60" r="2.7" fill="#bfdbfe"/>
    <circle cx="32" cy="32" r="4.4" fill="none" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="2.3" fill="#dbeafe"/>
  </g>

  <!-- one card back: frame, inner rule, the mark, and two axis points -->
  <g id="card">
    <rect x="-99" y="-154" width="198" height="308" rx="8"
          fill="url(#tcface)" stroke="#a855f7" stroke-opacity=".38" stroke-width="1.3"/>
    <rect x="-87" y="-142" width="174" height="284" rx="4"
          fill="none" stroke="#3b82f6" stroke-opacity=".18" stroke-width=".9"/>
    <use href="#magus" transform="translate(-48,-48) scale(1.5)"/>
    <circle cx="0" cy="-119" r="1.8" fill="#a855f7" fill-opacity=".5"/>
    <circle cx="0" cy="119" r="1.8" fill="#a855f7" fill-opacity=".5"/>
  </g>
</defs>

<rect width="800" height="500" fill="#07070d"/>
<rect width="800" height="500" fill="url(#tcglow)"/>

<!-- dealt left to right; the middle card sits proud of the other two -->
<g opacity=".6"><use href="#card" transform="translate(190 256) rotate(-7)"/></g>
<g opacity=".6"><use href="#card" transform="translate(610 256) rotate(7)"/></g>
<use href="#card" transform="translate(400 238)"/>
</svg>
