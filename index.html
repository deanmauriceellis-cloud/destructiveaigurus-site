<style>
:root{
  --void:#020204; --blue:#3b82f6; --blue-lit:#93c5fd; --violet:#a855f7;
  --text:#e8eaf0; --muted:#767d8e; --line:rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--void); color:var(--text); min-height:100vh;
  font-family:'DM Sans',system-ui,sans-serif; font-weight:300;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  display:flex; flex-direction:column;
}
/* the world, shut out: nothing lives past the edge of the circuit.
   Sits above the field but below the chrome, so the wordmark stays legible. */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 46%,transparent 34%,rgba(2,2,4,.34) 70%,rgba(2,2,4,.78) 100%);
}
.bar,.foot{position:relative;z-index:4}
.wrap{position:relative;z-index:2}
.bar{display:flex;align-items:center;justify-content:space-between;padding:22px 34px}
.mark{display:flex;align-items:center;gap:11px}
.mark svg{width:26px;height:26px}
.mark b{font-family:'Syne',sans-serif;font-weight:800;font-size:.82rem;line-height:1.15;display:block}
.mark i{font-style:normal;color:var(--blue)}
.tag{font-family:'JetBrains Mono',monospace;font-size:.63rem;letter-spacing:.2em;color:var(--muted)}

.wrap{flex:1;display:grid;place-items:center;padding:0 24px 40px}
.field{position:relative;width:min(88vw,640px);aspect-ratio:1}
.field svg.sigil{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* the circuit itself is the navigation: dim by default, a limb lights on focus */
.limb{stroke:var(--blue);stroke-width:1;opacity:.10;transition:opacity .3s}
.limb.lit{opacity:.85}
.ring{fill:none;stroke:var(--violet);stroke-width:1;stroke-dasharray:4 9;opacity:.26}

/* six destinations pinned to the six points of the mark */
.pt{
  position:absolute;transform:translate(-50%,-50%);
  background:none;border:0;cursor:pointer;padding:12px;
  font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.15em;
  color:var(--muted);transition:color .25s;display:flex;flex-direction:column;
  align-items:center;gap:10px;white-space:nowrap;text-decoration:none;
}
.pt .dot{
  width:13px;height:13px;border-radius:50%;
  border:1.5px solid rgba(147,197,253,.6); background:var(--void);
  transition:.25s;
}
.pt:hover,.pt:focus-visible{color:var(--text)}
.pt:hover .dot,.pt:focus-visible .dot{
  background:var(--blue);border-color:var(--blue);
  box-shadow:0 0 16px 3px rgba(59,130,246,.55);transform:scale(1.25);
}

/* the core reports what you are pointing at — this is the whole interface.
   The scrim is load-bearing: it clears the circuit so the readout stays legible. */
.core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(42%,242px);text-align:center;pointer-events:none;
}
.core::before{
  content:'';position:absolute;left:50%;top:50%;
  width:132%;height:150%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(2,2,4,.97) 0%,rgba(2,2,4,.9) 45%,rgba(2,2,4,0) 72%);
  z-index:-1;
}
.core .k{
  font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.24em;
  color:var(--violet);display:block;margin-bottom:11px;min-height:.8em;
}
.core h1{
  font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(.95rem,1.9vw,1.22rem);line-height:1.16;margin-bottom:10px;
  text-wrap:balance;
}
.core p{font-size:.74rem;line-height:1.5;color:#a2a9b8;min-height:3em}
.core .em{color:var(--blue)}

.foot{
  display:flex;justify-content:center;gap:26px;flex-wrap:wrap;
  padding:16px 34px 26px;border-top:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.16em;color:var(--muted);
}
.foot b{color:var(--text);font-weight:500}

/* ── the seal: the circuit draws itself closed on arrival ── */
.seal{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar,.foot,.pt,.core{animation:rise .9s ease 1.5s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.pt{animation-name:riseP}
@keyframes riseP{from{opacity:0}to{opacity:1}}
.core{animation-name:riseC}
@keyframes riseC{from{opacity:0}to{opacity:1}}

/* ── going deeper: the circuit opens toward the point you chose ── */
.field{transition:transform 1.05s cubic-bezier(.65,0,.35,1),opacity .8s ease .25s}
body.deeper .field{opacity:0}
body.deeper .bar,body.deeper .foot{opacity:0;transition:opacity .45s}
body.deeper::after{background:radial-gradient(ellipse at 50% 46%,transparent 0%,rgba(2,2,4,.2) 60%,var(--void) 100%);transition:background .9s}

@media (max-width:640px){
  .pt{font-size:.53rem;letter-spacing:.1em;padding:8px}
  .core p{font-size:.76rem}
  .bar{padding:18px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:2px}
</style>

<script>
(function(){
  const COPY={
    opportunity:['01 · THE OPPORTUNITY','Cost that scales with your success.','Per-call fees, overlapping licences, integration glue nobody owns.'],
    solution:   ['02 · THE SOLUTION','Directed local AI.','Same capability, running in your environment, on hardware you control.'],
    services:   ['03 · SERVICES','Eight places spend leaks.','Licensing, runtime, egress, resilience, governance, Sev1, advisory.'],
    work:       ['04 · THE WORK','Built, shipped, running.','Katrina\\'s Mystic Visitors Guide, the WWWatcher observatory, and TigerLine GIS.'],
    about:      ['05 · ABOUT','Forty years of enterprise architecture.','Pega Principal Technical Architect. Systems serving 200,000+ users.'],
    contact:    ['06 · CONTACT','One conversation.','contact@destructiveaigurus.com — no form, no funnel, no follow-up sequence.']
  };
  const DEF=['','We don\'t replace your platforms.<br><span class="em">We free them.</span>','Six ways in. Point at one.'];
  const k=document.getElementById('k'),h=document.getElementById('h'),p=document.getElementById('p');
  const limbs=[...document.querySelectorAll('.limb')];

  function show(key){
    const c=key?COPY[key]:DEF;
    k.textContent=c[0]; h.innerHTML=c[1]; p.textContent=c[2];
    limbs.forEach(l=>l.classList.toggle('lit',!!key&&l.dataset.k===key));
  }
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The seal: give every stroke its own length so the circuit draws itself closed.
  if(!reduce){
    document.querySelectorAll('.seal').forEach(el=>{
      const L=el.getTotalLength();
      el.style.setProperty('--len',L);
    });
  } else {
    document.querySelectorAll('.seal').forEach(el=>el.classList.remove('seal'));
    document.querySelectorAll('.bar,.foot,.pt,.core').forEach(el=>el.style.animation='none');
  }

  const field=document.querySelector('.field');

  document.querySelectorAll('.pt').forEach(b=>{
    const key=b.dataset.k;
    ['mouseenter','focus'].forEach(e=>b.addEventListener(e,()=>show(key)));
    ['mouseleave','blur'].forEach(e=>b.addEventListener(e,()=>show(null)));

    // Going deeper: the circuit opens toward the point you chose, then releases.
    b.addEventListener('click',ev=>{
      if(reduce||ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button!==0) return;
      ev.preventDefault();
      const r=b.getBoundingClientRect(), f=field.getBoundingClientRect();
      // push the chosen point toward the centre of the screen as the field opens
      const dx=(f.left+f.width/2)-(r.left+r.width/2);
      const dy=(f.top+f.height/2)-(r.top+r.height/2);
      field.style.transformOrigin=`${r.left-f.left+r.width/2}px ${r.top-f.top+r.height/2}px`;
      field.style.transform=`translate(${dx*.35}px,${dy*.35}px) scale(3.4)`;
      document.body.classList.add('deeper');
      setTimeout(()=>{location.href=b.getAttribute('href')},780);
    });
  });
  show(null);
})();
</script>
